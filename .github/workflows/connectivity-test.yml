name: connectivity-test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest   # 若 Binance 被拒，改为 self-hosted（见 README）
    steps:
      - name: Probe endpoints
        run: |
          for u in \
            "https://fapi.binance.com/fapi/v1/ping" \
            "https://fapi.binance.com/fapi/v1/exchangeInfo" \
            "https://api.binance.com/api/v3/exchangeInfo" \
            "https://data-api.binance.vision/api/v3/exchangeInfo" \
            "https://www.binance.com/bapi/defi/v1/public/wallet-direct/buw/wallet/cex/alpha/all/token/list" \
            "https://api.dexscreener.com/latest/dex/search?q=bnb" \
            "https://api.coingecko.com/api/v3/ping"; do
            code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' -A "Mozilla/5.0" "$u" || echo 000)
            echo "$code  $u"
          done
