# 阈值配置：修改后下次运行即生效，页面着色与"方法论"区块同步变化。
# direction: high = 越高越危险；low = 越低越危险。fmt: pct = 百分比显示；x = 倍数显示。
stage_a:
  metrics:
    oi_to_mcap:
      label: "OI / 流通市值"
      formula: "oi_usd / (price × circ_supply)"
      warn: 0.20
      alert: 0.50
      direction: high
      fmt: pct
    oi_to_dex_liq:
      label: "OI / DEX 流动性"
      formula: "oi_usd / dex_liq_usd"
      warn: 20
      alert: 100
      direction: high
      fmt: x
    perp_to_spot_vol:
      label: "合约量 / 现货量"
      formula: "perp_vol_24h_usd / dex_vol_24h_usd（现货量 = DEX 24h 成交额）"
      warn: 5
      alert: 20
      direction: high
      fmt: x
    float_ratio:
      label: "流通率"
      formula: "circ_supply / total_supply"
      warn: 0.25
      alert: 0.10
      direction: low
      fmt: pct

new_perp_days: 14            # 上合约 ≤ N 天标记"新"
circ_mismatch_pct: 0.20      # Alpha 与 CoinGecko 流通量差异超过此比例 → circ_mismatch
dex_min_pair_liq_usd: 10000  # 忽略流动性低于此值的 DEX pair
price_match_tolerance: 0.5   # Alpha 价格与合约价格相对偏差超过此值视为同名不同币
multi_alpha_dominance: 5     # 同名多个 Alpha 币时，流动性最大者需 ≥ 次大者的 N 倍才自动选用
